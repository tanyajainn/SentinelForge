name: Contextual v3 opt-in regression
on:
  push:
    paths:
      - sentinelforge/contextual_v3.py
      - sentinelforge/core.py
      - tests/test_contextual_v3.py
      - .github/workflows/contextual-v3.yml
  pull_request:
    paths:
      - sentinelforge/contextual_v3.py
      - sentinelforge/core.py
      - tests/test_contextual_v3.py
      - .github/workflows/contextual-v3.yml
  workflow_dispatch:
jobs:
  opt-in-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: V3 persistence and safety regressions
        run: python -m unittest discover -s tests -p 'test_contextual_v3.py' -v
      - name: Full Python unit suite
        run: python -m unittest discover -s tests -v
