name: Cross-platform sensor tests
on:
  push:
    branches: [main, feature/unified-security-analysis-v2]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "psutil>=5.9,<8"
      - run: python -m unittest discover -s tests -p 'test_cross_platform_sensor.py' -v
